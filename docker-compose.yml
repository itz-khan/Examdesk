# ExamDesk / ExamScale — multi-instance local stack
# Two identical backends share Postgres (+ optional Redis), fronted by nginx (LB demo).
#
# Quick start:
#   cp .env.example .env          # edit passwords/secrets
#   docker compose up --build
#   docker compose --profile seed run --rm seed
#
# Endpoints after start:
#   http://localhost:8000  backend-1
#   http://localhost:8001  backend-2
#   http://localhost:8080  load balancer (least active connections)
#   http://localhost:5432  postgres
#   http://localhost:6379  redis

name: examdesk

services:
  postgres:
    image: postgres:16
    container_name: examdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: examdesk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared environment for every API replica (identical code, shared DB).
  # INSTANCE_ID differs so /server-identity proves which container served the request.
  backend-1: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examdesk-backend-1
    restart: unless-stopped
    environment:
      APP_NAME: ExamDesk
      APP_VERSION: "1.0.0"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      HOST: "0.0.0.0"
      PORT: "8000"
      INSTANCE_ID: backend-1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-examdesk}
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CERT_SECRET_KEY: ${CERT_SECRET_KEY:-cert-verification-secret}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RUN_SCHEMA_INIT: "true"
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend-2:
    <<: *backend
    container_name: examdesk-backend-2
    environment:
      APP_NAME: ExamDesk
      APP_VERSION: "1.0.0"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      HOST: "0.0.0.0"
      PORT: "8000"
      INSTANCE_ID: backend-2
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-examdesk}
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CERT_SECRET_KEY: ${CERT_SECRET_KEY:-cert-verification-secret}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RUN_SCHEMA_INIT: "false"
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"

  # Least-connections proxy — stand-in for AWS Application Load Balancer locally
  lb:
    image: nginx:alpine
    container_name: examdesk-lb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy

  # One-shot seeder (not started by default)
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-examdesk}
      DATABASE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CERT_SECRET_KEY: ${CERT_SECRET_KEY:-cert-verification-secret}
      ENVIRONMENT: development
      INSTANCE_ID: seed-job
      RUN_SCHEMA_INIT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      backend-1:
        condition: service_healthy
    # Replaces image ENTRYPOINT — schema already created by backend-1
    entrypoint: ["python", "seed.py"]

  # Optional UI (production nginx build). API calls go through the LB on 8080.
  #   docker compose --profile frontend up --build
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: examdesk-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - lb

volumes:
  postgres_data:
