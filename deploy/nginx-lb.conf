# Local load balancer for two identical backend containers.
# Simulates an AWS ALB for college demos (round-robin).

upstream examdesk_backends {
    least_conn;
    server backend-1:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Passive failure tracking; this is not an active /ready health check.
    location / {
        proxy_pass http://examdesk_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Pass through instance identity for demos
        proxy_pass_header X-Instance-ID;
    }
}
